<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Leon OS</title>
<style>
:root{--bg:#07090d;--panel:#10141c;--line:#262c38;--text:#eef2f6;--dim:#8d95a6;--red:#ff3b3b;--amber:#e4b15a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 Segoe UI,system-ui,sans-serif}a{color:inherit;text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}header b{letter-spacing:.18em}header span{color:var(--dim)}
.desk{display:grid;grid-template-columns:260px 1fr 280px;gap:12px;padding:12px}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
h2{margin:0 0 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.vital,.skill{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}a.skill:hover,a.vital:hover{color:var(--amber)}
.stage{position:relative;min-height:420px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#3a1216,#0b0d12 70%);border-radius:12px}
.sweep{position:absolute;top:0;bottom:0;width:2px;background:var(--amber);box-shadow:0 0 16px var(--amber);animation:sweep 16s linear infinite}
.core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.core strong{font-size:34px;letter-spacing:.22em}.core em{color:var(--dim);font-style:normal;margin-top:6px}
.pills{display:flex;gap:6px;margin-top:14px}.pills span{border:1px solid var(--line);border-radius:99px;padding:4px 8px;color:var(--dim)}.pills .now{background:var(--amber);color:#1b1406;border-color:var(--amber)}
@keyframes sweep{from{left:12%}to{left:88%}}
@media(max-width:900px){.desk{grid-template-columns:1fr}}
</style></head><body>
<header><b>LEON OS</b><span id="clock">desk</span></header>
<div class="desk">

<a class="vital" href="https://drive.google.com/drive/folders/1DK0hUtL6NxmnpxPhkToKHt3_2V-rNoYl" target="_blank" rel="noopener"><span>Inbox</span><b>1</b></a>

<a class="vital" href="https://drive.google.com/drive/folders/1jOKA8fJvgd8EI_KXwPaf9_7G2iBRMqhm" target="_blank" rel="noopener"><span>PM due 30d</span><b>—</b></a>
<a class="vital" href="https://drive.google.com/drive/folders/1Nma3XiCEZfqvPK7-OFWrAsZDiIHwdv9e" target="_blank" rel="noopener"><span>House cap</span><b>$2k</b></a>
<a class="vital" href="https://outlook.office.com/mail/" target="_blank" rel="noopener"><span>Outlook</span><b>open</b></a>

</section>

<a class="skill" href="https://drive.google.com/drive/folders/1jOKA8fJvgd8EI_KXwPaf9_7G2iBRMqhm" target="_blank" rel="noopener"><span>Room PM</span><span>→</span></a>

</section></div>
<script>function tick(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit'});document.getElementById('sub').textContent='idle · '+n.toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,15000);</script>
</body></html>
